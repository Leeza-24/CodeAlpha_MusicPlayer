<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Music Player</title>

  <link rel="stylesheet"
        href="style.css">

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

  <h1 class="logo">
    Music Player
  </h1>

  <ul>

    <li>
      <i class="fa-solid fa-house"></i>
      Home
    </li>

    <li>
      <i class="fa-solid fa-magnifying-glass"></i>
      Search
    </li>

    <li>
      <i class="fa-solid fa-book"></i>
      Library
    </li>

  </ul>

</div>

<!-- Main -->

<div class="main">

  <!-- Search Bar -->

  <div class="topbar">

    <input type="text"
           id="search"
           placeholder="Search music...">

  </div>

  <!-- Heading -->

  <h2>
    Trending Songs
  </h2>

  <!-- Songs -->

  <div class="songs-container"
       id="songs-container">

  </div>

</div>

<!-- Bottom Music Player -->

<div class="player">

  <!-- Song Info -->

  <div class="song-info">

    <img src="images/music1.jpg"
         id="cover">

    <div>

      <h3 id="title">
        Perfect
      </h3>

      <p id="artist">
        Ed Sheeran
      </p>

    </div>

  </div>

  <!-- Controls -->

  <div class="controls">

    <button onclick="prevSong()">
      ⏮
    </button>

    <button onclick="playPause()"
            id="play-btn">
      ▶
    </button>

    <button onclick="nextSong()">
      ⏭
    </button>

  </div>

  <!-- Progress -->

  <div class="progress-box">

    <input type="range"
           id="progress"
           value="0">

  </div>

  <audio id="audio"></audio>

</div>

<script src="script.js"></script>

</body>
</html>
